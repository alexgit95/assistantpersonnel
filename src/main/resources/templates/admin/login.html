<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Administration | Assistant</title>
    <link rel="stylesheet" th:href="@{/css/theme.css}">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>
<main class="admin-shell login-shell">
    <a class="back-link" data-typewriter th:href="@{/}">Retour à l'accueil</a>
    <h1 data-typewriter>Administration</h1>
     <p id="login-message" class="notice" role="status" aria-live="polite"
         th:if="${param.error}" data-typewriter>Identifiants invalides ou compte temporairement bloqué.</p>
    <p class="notice" role="status" aria-live="polite" th:if="${param.logout}" data-typewriter>Vous êtes déconnecté.</p>
    <form method="post" th:action="@{/admin/login}" class="admin-form">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <label for="username" data-typewriter>Identifiant</label>
        <input id="username" name="username" type="text" autocomplete="username" required autofocus>
        <label for="password" data-typewriter>Mot de passe</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <button type="submit" data-typewriter>Se connecter</button>
    </form>
</main>
<script type="module" th:src="@{/js/admin.js}"></script>
</body>
</html>
