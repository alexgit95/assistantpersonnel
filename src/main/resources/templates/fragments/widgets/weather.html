<div th:fragment="content" class="weather-widget" data-weather-widget
     th:attr="data-config-json=${appConfigJson}">
    <p data-weather-status role="status" aria-live="polite" data-typewriter>Préparation de la météo…</p>
    <section data-weather-current hidden>
        <h3 data-weather-location></h3>
        <p data-weather-now></p>
        <ul class="weather-days" data-weather-days></ul>
    </section>
    <p class="weather-config-required" data-weather-config-required hidden>Aucune ville configurée.</p>
</div>
