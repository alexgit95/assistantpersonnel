<!DOCTYPE html>
<html lang="fr" class="home-page" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Assistant</title>
    <link rel="stylesheet" th:href="@{/css/theme.css}">
    <link rel="stylesheet" th:href="@{/css/home.css}">
</head>
<body class="home-body">
<header th:replace="~{fragments/profile-header :: header(true)}"></header>
<main id="apps" class="dashboard-grid" aria-label="Tableau de widgets">
    <section class="widget-slot slot-left-top" data-slot-index="1" aria-label="Emplacement en haut à gauche"></section>
    <section class="widget-slot slot-left-bottom" data-slot-index="2" aria-label="Emplacement en bas à gauche"></section>
    <section class="widget-slot slot-main" data-slot-index="0" aria-label="Emplacement principal"></section>
    <section class="widget-slot slot-right-top" data-slot-index="3" aria-label="Emplacement en haut à droite"></section>
    <section class="widget-slot slot-right-bottom" data-slot-index="4" aria-label="Emplacement en bas à droite"></section>
</main>
<pre id="debug" hidden></pre>
<section id="capture-overlay" class="capture-overlay" aria-live="polite" hidden>
    <p id="capture-title" class="capture-title"></p>
    <p id="capture-count" class="capture-count"></p>
    <p id="capture-hint" class="capture-hint"></p>
    <p id="capture-progress" class="capture-progress"></p>
    <p id="capture-message" class="capture-message"></p>
</section>
<script type="module" th:src="@{/js/home.js}"></script>
</body>
</html>
