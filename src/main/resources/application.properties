# Les valeurs par defaut ci-dessous sont surchargeables par variable d'environnement.
spring.application.name=assistant
spring.profiles.default=local

server.port=${SERVER_PORT:8080}
server.forward-headers-strategy=none
server.tomcat.threads.max=20
server.servlet.encoding.force=true
spring.servlet.multipart.max-file-size=${assistant.backup.max-upload-mb}MB
spring.servlet.multipart.max-request-size=${assistant.backup.max-upload-mb}MB
server.servlet.session.timeout=${ASSISTANT_ADMIN_SESSION_TIMEOUT:15m}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.secure=${SERVER_SERVLET_SESSION_COOKIE_SECURE:false}

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update

spring.mvc.problemdetails.enabled=true
spring.thymeleaf.cache=true

assistant.session.duration-minutes=${ASSISTANT_SESSION_DURATION_MINUTES:10}
assistant.session.heartbeat-min-interval-seconds=${ASSISTANT_HEARTBEAT_MIN_INTERVAL_SECONDS:30}
assistant.session.logout-pause-seconds=${ASSISTANT_LOGOUT_PAUSE_SECONDS:60}

assistant.scan.interval-disconnected-ms=${ASSISTANT_SCAN_INTERVAL_DISCONNECTED_MS:1000}
assistant.scan.interval-connected-ms=${ASSISTANT_SCAN_INTERVAL_CONNECTED_MS:5000}

assistant.recognition.match-threshold=${ASSISTANT_MATCH_THRESHOLD:0.55}
assistant.recognition.match-margin=${ASSISTANT_MATCH_MARGIN:0.05}
assistant.recognition.switch-confirmations=${ASSISTANT_SWITCH_CONFIRMATIONS:2}
assistant.recognition.detector-input-size=${ASSISTANT_DETECTOR_INPUT_SIZE:224}
assistant.recognition.detector-min-confidence=${ASSISTANT_DETECTOR_MIN_CONFIDENCE:0.5}
assistant.recognition.min-face-size-px=${ASSISTANT_MIN_FACE_SIZE_PX:80}
assistant.recognition.camera-width=${ASSISTANT_CAMERA_WIDTH:640}
assistant.recognition.backend=${ASSISTANT_RECOGNITION_BACKEND:auto}
assistant.recognition.debug=${ASSISTANT_RECOGNITION_DEBUG:false}

assistant.enrollment.photos=${ASSISTANT_ENROLLMENT_PHOTOS:8}
assistant.enrollment.max-profiles=${ASSISTANT_MAX_PROFILES:0}
assistant.enrollment.remote.countdown-seconds=${ASSISTANT_ENROLLMENT_REMOTE_COUNTDOWN_SECONDS:5}
assistant.enrollment.remote.interval-seconds=${ASSISTANT_ENROLLMENT_REMOTE_INTERVAL_SECONDS:4}
assistant.enrollment.remote.session-ttl-minutes=${ASSISTANT_ENROLLMENT_REMOTE_SESSION_TTL_MINUTES:10}
assistant.enrollment.remote.max-consecutive-failures=${ASSISTANT_ENROLLMENT_REMOTE_MAX_CONSECUTIVE_FAILURES:3}

assistant.public-base-url=${ASSISTANT_PUBLIC_BASE_URL:}

assistant.kiosk.key=${ASSISTANT_KIOSK_KEY:}
assistant.kiosk.poll-idle-ms=${ASSISTANT_KIOSK_POLL_IDLE_MS:3000}
assistant.kiosk.poll-active-ms=${ASSISTANT_KIOSK_POLL_ACTIVE_MS:1000}

assistant.handoff.token-ttl-seconds=${ASSISTANT_HANDOFF_TOKEN_TTL_SECONDS:120}
assistant.handoff.full-session-minutes=${ASSISTANT_HANDOFF_FULL_SESSION_MINUTES:30}
assistant.handoff.weight-session-minutes=${ASSISTANT_HANDOFF_WEIGHT_SESSION_MINUTES:10}

assistant.qr.dev-mode=${ASSISTANT_QR_DEV_MODE:false}
assistant.qr.size-rem=${ASSISTANT_QR_SIZE_REM:6.5}

assistant.weather.cache-minutes=${ASSISTANT_WEATHER_CACHE_MINUTES:30}

assistant.prim.daily-budget=${ASSISTANT_PRIM_DAILY_BUDGET:750}
assistant.prim.cache-minutes=${ASSISTANT_PRIM_CACHE_MINUTES:10}
assistant.prim.pause-from=${ASSISTANT_PRIM_PAUSE_FROM:22:00}
assistant.prim.pause-to=${ASSISTANT_PRIM_PAUSE_TO:05:00}

assistant.ui.typing-enabled=${ASSISTANT_UI_TYPING_ENABLED:true}
assistant.ui.typing-speed-ms=${ASSISTANT_UI_TYPING_SPEED_MS:25}

assistant.backup.max-upload-mb=${ASSISTANT_BACKUP_MAX_UPLOAD_MB:50}

assistant.face-assets.mode=${ASSISTANT_FACE_ASSETS_MODE:local}
assistant.face-assets.face-api-url=${ASSISTANT_FACE_API_URL:/vendor/face-api/face-api.js}
assistant.face-assets.models-url=${ASSISTANT_FACE_MODELS_URL:/vendor/face-api/model}
assistant.face-assets.wasm-script-url=${ASSISTANT_FACE_WASM_SCRIPT_URL:/vendor/face-api/wasm/tf-backend-wasm.js}
assistant.face-assets.wasm-url=${ASSISTANT_FACE_WASM_URL:/vendor/face-api/wasm/}

assistant.admin.username=${ASSISTANT_ADMIN_USERNAME:admin}
assistant.admin.password=${ASSISTANT_ADMIN_PASSWORD}
assistant.admin.max-failed-attempts=${ASSISTANT_ADMIN_MAX_FAILED_ATTEMPTS:5}
assistant.admin.lockout-minutes=${ASSISTANT_ADMIN_LOCKOUT_MINUTES:15}
