# HTTPS (kiosque, webcam) et HTTP (smartphones) en parallele : mode remote.
assistant.https.enabled=true
assistant.http.enabled=true
server.port=${assistant.https.port}
server.ssl.bundle=kiosk
spring.ssl.bundle.jks.kiosk.keystore.location=file:${assistant.https.keystore-path}
spring.ssl.bundle.jks.kiosk.keystore.type=${assistant.https.keystore-type}
spring.ssl.bundle.jks.kiosk.keystore.password=${assistant.https.keystore-password}
