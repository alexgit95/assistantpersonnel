# Assets de reconnaissance charges depuis le CDN (modes dev et onprem). Le mode remote utilise les valeurs locales de application.properties.
assistant.face-assets.mode=${ASSISTANT_FACE_ASSETS_MODE:cdn}
assistant.face-assets.face-api-url=${ASSISTANT_FACE_API_URL:https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.15/dist/face-api.js}
assistant.face-assets.models-url=${ASSISTANT_FACE_MODELS_URL:https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.15/model}
assistant.face-assets.wasm-script-url=${ASSISTANT_FACE_WASM_SCRIPT_URL:https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-wasm@4.22.0/dist/tf-backend-wasm.js}
assistant.face-assets.wasm-url=${ASSISTANT_FACE_WASM_URL:https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-wasm@4.22.0/dist/}
